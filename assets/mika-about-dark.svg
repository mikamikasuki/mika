  <g font-family="ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800" text-anchor="middle">
    <text x="625" y="52" fill="#f2a7c6" font-size="22">🌷 CS undergraduate at Rutgers University, currently spending a one-year gap year in California.</text>
    <text x="625" y="95" fill="#c5adff" font-size="21">Next year, I’ll be heading to UT Austin for a Master’s in Computer Science on a full scholarship.</text>
    <text x="625" y="138" fill="#eea8cd" font-size="18">I hope to use both my technical skills and my token budget to give back to the open-source community. ♡</text>
  </g>
