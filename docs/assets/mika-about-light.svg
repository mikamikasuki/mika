  </g>
  <g fill="#bb9ee5" opacity=".62" shape-rendering="crispEdges">
    <rect x="174" y="34" width="4" height="4" /><rect x="1031" y="111" width="3" height="3" />
  </g>
  <g font-family="ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="800" text-anchor="middle">
    <text x="625" y="52" fill="#b25e8d" font-size="22">🌷 CS undergraduate at Rutgers University, currently spending a one-year gap year in California.</text>
    <text x="625" y="95" fill="#9675e3" font-size="21">Next year, I’ll be heading to UT Austin for a Master’s in Computer Science on a full scholarship.</text>
    <text x="625" y="138" fill="#b25e8d" font-size="18">I hope to use both my technical skills and my token budget to give back to the open-source community. ♡</text>
  </g>
  <g transform="translate(1104 91) scale(.77)" shape-rendering="crispEdges" filter="url(#cloud-shadow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 5;0 0" dur="8.2s" repeatCount="indefinite" />
      <path fill="#b3a2e9" d="M9 42H3V30H9V24H18V15H30V9H45V3H72V9H87V15H99V24H108V30H117V42H111V51H15V45H9Z" />
