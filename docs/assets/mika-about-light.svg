<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="175" viewBox="0 0 1200 175" role="img" aria-labelledby="title desc">
  <title id="title">About Mika</title>
  <desc id="desc">Mika studies computer science at Rutgers, is spending a gap year in California, and plans to attend UT Austin on a full scholarship.</desc>
  <defs>
    <filter id="cloud-shadow" x="-25%" y="-35%" width="150%" height="180%"><feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#9c84d5" flood-opacity=".16" /></filter>
  </defs>
  <g transform="translate(26 39)" shape-rendering="crispEdges" filter="url(#cloud-shadow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;4 -6;0 0" dur="6.8s" repeatCount="indefinite" />
      <path fill="#aa9be7" d="M9 42H3V30H9V24H18V15H30V9H45V3H72V9H87V15H99V24H108V30H117V42H111V51H15V45H9Z" />
