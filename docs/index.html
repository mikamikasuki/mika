<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff8fc" />
  <title>Mika — researcher and builder</title>
  <meta name="description" content="Mika’s profile and interactive travel map demo." />
  <link rel="stylesheet" href="./travel/styles.css" />
</head>
<body>
  <main class="home-shell">
    <img class="profile-banner" src="./assets/mika-typing-banner.svg" alt="Hi, I’m Mika" />
    <picture class="about-picture">
      <source media="(prefers-color-scheme: dark)" srcset="./assets/mika-about-dark.svg" />
      <img src="./assets/mika-about-light.svg" alt="About Mika" />
    </picture>
    <a class="cards-link" href="./travel/" aria-label="Open Mika’s interactive travel map">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="./assets/generated/profile-dark.svg" />
        <img src="./assets/generated/profile-light.svg" alt="Compact profile statistics, contribution streak, and a map of sample travel states" />
      </picture>
    </a>
    <p class="home-link"><a href="./travel/">Explore the interactive travel map →</a></p>
    <footer>Travel map demo · California + New Jersey sample entries</footer>
  </main>
</body>
</html>
